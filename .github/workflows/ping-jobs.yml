name: ping-jobs
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping job queue worker
        run: |
          curl -fsS -X POST "https://podryad-pro-kohl.vercel.app/api/cron/jobs?limit=5" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -w "\nHTTP %{http_code}\n" \
            --max-time 120
